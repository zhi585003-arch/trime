name: Build Trime Offline ARM64

on:
  workflow_dispatch:
  push:
    branches: [offline-custom]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI_NAME: Personal Offline Build
      BUILD_ABI: arm64-v8a
    steps:
      - name: Checkout customized Trime
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Checkout pinned Rime Ice
        uses: actions/checkout@v6
        with:
          repository: iDvel/rime-ice
          ref: da1fbe602e38f26db846fa10120ee64c2b0324c0
          path: .rime-ice
          persist-credentials: false

      - name: Bundle offline dictionaries
        run: python3 script/prepare-offline-data.py .rime-ice

      - name: Check clipboard database rules
        run: |
          python3 script/test-offline-clipboard.py
          python3 script/check-offline-ui.py

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Preserve personal debug signing key
        uses: actions/cache@v5
        with:
          path: ~/trime-signing/debug.keystore
          key: trime-offline-debug-signing-v2

      - name: Ensure explicit debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/trime-signing"
          if [ ! -f "$HOME/trime-signing/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/trime-signing/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          echo "TRIME_DEBUG_KEYSTORE=$HOME/trime-signing/debug.keystore" >> "$GITHUB_ENV"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install build tools
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.0.13004108" \
            "cmake;3.31.6"

      - name: Apply upstream Lua patch
        run: |
          make patch-apply
          python3 script/patch-private-learning.py

      - name: Check Kotlin before native build
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin -PbuildABI=arm64-v8a --max-workers=4 --console=plain

      - name: Build APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug \
            -PbuildABI=arm64-v8a \
            --max-workers=4 --console=plain --stacktrace 2>&1 | tee build.log

      - name: Test pinyin prefix selection
        run: ./gradlew :app:testDebugUnitTest --tests "*PinyinChoicesTest" -PofflinePinyinTests=true -PbuildABI=arm64-v8a --max-workers=4 --console=plain

      - name: Verify offline APK and bundled data
        shell: bash
        run: |
          python3 script/verify-offline-apk.py

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: trime-v3.3.9-offline-arm64
          path: |
            app/build/outputs/apk/debug/*.apk
            offline/使用说明.md
            apk-verification.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: offline-build-logs
          path: |
            build.log
            app/build/reports/tests/testDebugUnitTest/**
            apk-verification.txt
            app/build/intermediates/cxx/**/logs/**
          if-no-files-found: ignore
          retention-days: 14
