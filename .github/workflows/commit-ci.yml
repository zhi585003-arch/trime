name: Build Trime 3.3.9 ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      CI_NAME: Personal Cloud Build
      BUILD_ABI: arm64-v8a

    steps:
      - name: Checkout Trime v3.3.9
        uses: actions/checkout@v6
        with:
          ref: 6a10567e27e86c1b9d38f864be94b36c2d9fae30
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install build tools
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.0.13004108" \
            "cmake;3.31.6"

      - name: Apply upstream Lua patch
        run: make patch-apply

      - name: Build APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug \
            -PbuildABI=arm64-v8a \
            --max-workers=4 \
            --console=plain \
            --stacktrace 2>&1 | tee build.log

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: trime-v3.3.9-arm64-debug
          path: app/build/outputs/apk/debug/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-logs
          path: |
            build.log
            app/build/intermediates/cxx/**/logs/**
          retention-days: 14
